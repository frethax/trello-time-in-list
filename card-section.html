<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #172b4d;
      background: transparent;
      padding: 4px 0;
    }
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .card {
      background: #f4f5f7;
      border: 1px solid #dfe1e6;
      border-radius: 8px;
      padding: 12px;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #5e6c84;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .list-name {
      font-size: 13px;
      font-weight: 600;
      color: #172b4d;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .time-green { font-size: 18px; font-weight: 700; color: #2ea043; }
    .time-blue  { font-size: 18px; font-weight: 700; color: #0052cc; }
    .right-card { }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #5e6c84;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }
    .bar-row { margin-bottom: 7px; }
    .bar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .bar-name {
      font-size: 11px;
      color: #172b4d;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55%;
    }
    .bar-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .bar-pct { font-size: 10px; font-weight: 700; min-width: 28px; text-align: right; }
    .bar-time { font-size: 11px; color: #5e6c84; white-space: nowrap; }
    .bar-track {
      height: 6px;
      background: #dfe1e6;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 6px; }
    .divider { border: none; border-top: 1px solid #dfe1e6; margin: 10px 0; }
    .history-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .history-label {
      font-size: 11px;
      font-weight: 600;
      color: #5e6c84;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .arrow {
      font-size: 9px;
      color: #5e6c84;
      transition: transform 0.2s;
    }
    .timeline-list {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease, margin-top 0.25s ease;
      margin-top: 0;
    }
    .tl-item {
      display: flex;
      gap: 8px;
      padding-bottom: 10px;
    }
    .tl-line-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 10px;
    }
    .tl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .tl-line {
      width: 2px; flex: 1;
      background: #dfe1e6;
      margin-top: 3px;
    }
    .tl-content { flex: 1; min-width: 0; }
    .tl-name {
      font-size: 11px; font-weight: 600; color: #172b4d;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tl-meta { font-size: 10px; color: #5e6c84; margin-top: 1px; }
    .empty { font-size: 12px; color: #5e6c84; padding: 8px 0; }
    .loading { font-size: 12px; color: #5e6c84; padding: 8px 0; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">⏳ Yükleniyor...</div></div>
 <script src="/api.js"></script>
<script src="/ui.js"></script>
<script src="/section.js"></script>
</body>
</html>
