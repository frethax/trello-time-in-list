<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #172b4d;
      background: #f4f5f7;
      padding: 20px;
    }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 11px; font-weight: 700; color: #5e6c84;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px;
    }
    .lang-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 7px 14px; border: 2px solid #dfe1e6;
      border-radius: 8px; background: white; font-size: 13px;
      font-weight: 600; color: #5e6c84; cursor: pointer; transition: all 0.15s;
    }
    .lang-btn:hover { border-color: #0052cc; color: #0052cc; }
    .lang-btn.active { border-color: #0052cc; color: #0052cc; background: #e8f0ff; }

    /* List header */
    .list-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px 6px;
    }
    .header-name { flex: 1; }
.header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-label { font-size: 10px; font-weight: 600; color: #97a0af; text-transform: uppercase; letter-spacing: 0.4px; }
    .header-days { width: 64px; text-align: center; }
.header-days { width: 64px; text-align: center; }
.header-input-col { width: 64px; text-align: center; }
.header-toggle-col { width: 40px; text-align: center; }
    /* List items */
    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      background: white; border: 1px solid #dfe1e6;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
      gap: 8px;
    }
    .list-name {
      flex: 1; font-size: 13px; font-weight: 500; color: #172b4d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .item-controls {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .threshold-input {
      width: 64px; padding: 5px 8px;
      border: 1px solid #dfe1e6; border-radius: 6px;
      font-size: 13px; text-align: center; color: #172b4d;
    }
    .threshold-input:focus { outline: none; border-color: #0052cc; }

    .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #dfe1e6; border-radius: 22px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #0052cc; }
    input:checked + .slider:before { transform: translateX(18px); }

    .save-btn {
      width: 100%; padding: 12px; background: #0052cc; color: white;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    .save-btn:hover { background: #0065ff; }
    .loading { text-align: center; color: #5e6c84; padding: 24px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="section">
      <div class="section-title" id="lang-title">Language</div>
      <div class="lang-options">
        <button class="lang-btn active" id="lang-en" onclick="setLang('en')">English</button>
        <button class="lang-btn" id="lang-tr" onclick="setLang('tr')">Türkçe</button>
        <button class="lang-btn" id="lang-es" onclick="setLang('es')">Español</button>
        <button class="lang-btn" id="lang-pt" onclick="setLang('pt')">Português</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title" id="lists-title">List Settings</div>
      <div id="lists"><div class="loading">Loading...</div></div>
    </div>
    <button class="save-btn" id="save" style="display:none">Save Settings</button>
  </div>
  <script src="/settings.js"></script>
</body>
</html>
