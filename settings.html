<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; color: #172b4d; background: #f4f5f7; padding: 20px;
    }
    .section { margin-bottom: 20px; }
    .section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 11px; font-weight: 700; color: #5e6c84;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px;
    }
    .lang-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 7px 14px; border: 2px solid #dfe1e6; border-radius: 8px;
      background: white; font-size: 13px; font-weight: 600; color: #5e6c84;
      cursor: pointer; transition: all 0.15s;
    }
    .lang-btn:hover { border-color: #0052cc; color: #0052cc; }
    .lang-btn.active { border-color: #0052cc; color: #0052cc; background: #e8f0ff; }

    /* Generic white card — every section's white content box uses this */
    .card {
      background: white; border: 1px solid #dfe1e6; border-radius: 8px;
      padding: 12px 14px;
    }

    /* Help box */
    .help-box {
      display: flex; flex-direction: column; gap: 6px;
    }
    .help-row {
      font-size: 12px; color: #5e6c84; line-height: 1.5;
    }

    .list-item {
      display: flex; align-items: center;
      background: white; border: 1px solid #dfe1e6;
      border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; gap: 10px;
    }
    .list-item:last-child { margin-bottom: 0; }
    .list-item.ignored { opacity: 0.45; }
    .list-name {
      flex: 1; font-size: 13px; font-weight: 500; color: #172b4d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .item-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .control-label { font-size: 11px; color: #5e6c84; white-space: nowrap; }
    .flag-pill {
      display: flex; align-items: center; gap: 5px;
      background: #f4f5f7; border: 1px solid #dfe1e6;
      border-radius: 6px; padding: 3px 8px; transition: all 0.2s;
    }
    .flag-pill.active { background: #ffebe6; border-color: #eb5a46; }
    .flag-pill.active .flag-icon { color: #eb5a46; }
    .flag-pill.active .control-label { color: #eb5a46; }
    .flag-icon { font-size: 12px; }
    .threshold-input {
      width: 44px; padding: 2px 4px; border: none; background: transparent;
      font-size: 13px; text-align: center; color: #172b4d; outline: none;
    }
    .flag-pill.active .threshold-input { color: #eb5a46; font-weight: 600; }
    .separator { width: 1px; height: 20px; background: #dfe1e6; flex-shrink: 0; }
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #dfe1e6; border-radius: 20px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #0052cc; }
    input:checked + .slider:before { transform: translateX(16px); }
    .save-btn {
      width: 100%; padding: 12px; background: #0052cc; color: white;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .save-btn:hover { background: #0065ff; }
    .loading { text-align: center; color: #5e6c84; padding: 24px; }

    /* Export */
    .export-buttons { display: flex; gap: 8px; }
    .export-btn {
      flex: 1 1 0; min-width: 0; height: 38px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 600;
      border: 2px solid #dfe1e6; background: white; color: #172b4d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; transition: all 0.15s;
    }
    .export-btn:hover { border-color: #0052cc; color: #0052cc; }
    .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .export-status {
      font-size: 11px; color: #5e6c84;
      height: 0; overflow: hidden; transition: height 0.15s;
    }
    .export-status.visible { height: 16px; margin-top: 8px; }

    /* Contact */
    .contact-btn {
      width: 100%; height: 38px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      border: 2px solid #dfe1e6; background: white; color: #172b4d;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .contact-btn:hover { border-color: #0052cc; color: #0052cc; }

    /* Numbering */
    .num-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .num-row + .num-row { border-top: 1px solid #f0f1f3; }
    .num-label { flex: 1; font-size: 13px; font-weight: 500; color: #172b4d; }
    .num-sub { font-size: 11px; color: #5e6c84; font-weight: 400; margin-top: 2px; }
    .prefix-input {
      width: 80px; height: 30px; padding: 0 8px; border: 2px solid #dfe1e6;
      border-radius: 6px; font-size: 13px; font-weight: 600; color: #172b4d; outline: none;
      background: #ffffff; color-scheme: light;
    }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 2px solid #ffffff; box-shadow: 0 0 0 1px #dfe1e6; padding: 0;
    }
    .swatch.active { box-shadow: 0 0 0 2px #0052cc; }
    .num-pill {
      display: inline-block; padding: 1px 8px; border-radius: 4px;
      font-size: 12px; font-weight: 600; color: #172b4d; margin-left: 4px;
    }
    .prefix-input:focus { border-color: #0052cc; }
    .pos-btn { padding: 5px 12px; font-size: 12px; }
    .num-help { font-size: 12px; color: #5e6c84; line-height: 1.5; margin-top: 8px; }
    .num-actions { display: flex; gap: 8px; margin-top: 10px; }
    .export-btn.danger:hover { border-color: #eb5a46; color: #eb5a46; }
    .export-btn.confirm { border-color: #eb5a46; color: #eb5a46; background: #ffebe6; }
    .num-disabled { opacity: 0.45; pointer-events: none; }

    /* Accordion sections */
    .acc {
      background: white; border: 1px solid #dfe1e6; border-radius: 8px;
      margin-bottom: 10px;
    }
    .acc > summary {
      list-style: none; display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer; user-select: none;
    }
    .acc > summary::-webkit-details-marker { display: none; }
    .acc > summary:hover .section-title { color: #0052cc; }
    .acc > summary .section-title { margin: 0; flex: 1; }
    .acc-meta { font-size: 12px; color: #5e6c84; white-space: nowrap; }
    .chev {
      width: 7px; height: 7px; flex-shrink: 0; margin-right: 2px;
      border-right: 2px solid #5e6c84; border-bottom: 2px solid #5e6c84;
      transform: rotate(-45deg); transition: transform 0.15s;
    }
    .acc[open] > summary .chev { transform: rotate(45deg); }
    .acc-body { padding: 0 14px 14px; }
    .acc-body > .card { border: none; padding: 0; background: transparent; }
    .acc-body .help-box {
      background: #f4f5f7; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="root">
    <details class="acc" data-key="lang">
      <summary><span class="section-title" id="lang-title">Language</span><span class="acc-meta" id="lang-meta"></span><span class="chev"></span></summary>
      <div class="acc-body">
        <div class="lang-options">
          <button class="lang-btn active" id="lang-en">English</button>
          <button class="lang-btn" id="lang-tr">Türkçe</button>
          <button class="lang-btn" id="lang-es">Español</button>
          <button class="lang-btn" id="lang-pt">Português</button>
        </div>
      </div>
    </details>

    <details class="acc" data-key="lists" open>
      <summary><span class="section-title" id="lists-title">List Settings</span><span class="chev"></span></summary>
      <div class="acc-body">
        <div class="help-box">
          <div class="help-row" id="help-flag"></div>
          <div class="help-row" id="help-done"></div>
          <div class="help-row" id="help-ignore"></div>
        </div>
        <div id="lists"><div class="loading">Loading...</div></div>
        <button class="save-btn" id="save" style="display:none; margin-top: 10px;">Save Settings</button>
      </div>
    </details>

    <details class="acc" data-key="numbers">
      <summary><span class="section-title" id="num-title">Card Numbers</span><span class="acc-meta" id="num-meta"></span><span class="chev"></span></summary>
      <div class="acc-body">
      <div class="card">
        <div class="num-row">
          <div class="num-label"><span id="num-enable-label">Enable card numbers</span>
            <div class="num-sub" id="num-enable-sub"></div></div>
          <label class="toggle"><input type="checkbox" id="num-enabled"><span class="slider"></span></label>
        </div>
        <div id="num-options">
          <div class="num-row">
            <div class="num-label"><span id="num-prefix-label">Prefix</span>
              <div class="num-sub" id="num-preview"></div></div>
            <input class="prefix-input" id="num-prefix" maxlength="8" value="#">
          </div>
          <div class="num-row">
            <div class="num-label" id="num-color-label">Badge color</div>
            <div class="swatches" id="num-swatches"></div>
          </div>
          <div class="num-row">
            <div class="num-label" id="num-pos-label">Position in description</div>
            <div class="lang-options">
              <button class="lang-btn pos-btn" id="num-pos-top">Top</button>
              <button class="lang-btn pos-btn active" id="num-pos-bottom">Bottom</button>
            </div>
          </div>
        </div>
        <div class="num-actions">
          <button class="export-btn" id="num-apply">Number all cards</button>
          <button class="export-btn danger" id="num-remove">Remove all numbers</button>
        </div>
        <button class="save-btn" id="num-grant" style="display:none; margin-top:10px;">Grant write access</button>
        <div class="num-help" id="num-help"></div>
        <div class="export-status" id="num-status"></div>
      </div>
      </div>
    </details>

    <details class="acc" data-key="subtasks">
      <summary><span class="section-title" id="sub-title">Subtasks</span><span class="acc-meta" id="sub-meta"></span><span class="chev"></span></summary>
      <div class="acc-body">
      <div class="card">
        <div class="num-row">
          <div class="num-label"><span id="sub-enable-label">Enable main tasks &amp; subtasks</span>
            <div class="num-sub" id="sub-preview"></div></div>
          <label class="toggle"><input type="checkbox" id="sub-enabled"><span class="slider"></span></label>
        </div>
        <div id="sub-options">
          <div class="num-row">
            <div class="num-label" id="sub-display-label">Badge shows</div>
            <div class="lang-options">
              <button class="lang-btn pos-btn" id="sub-display-number">Number</button>
              <button class="lang-btn pos-btn" id="sub-display-name">Name</button>
              <button class="lang-btn pos-btn" id="sub-display-both">Both</button>
            </div>
          </div>
          <div class="num-row">
            <div class="num-label"><span id="sub-parent-label">Show badge on main tasks</span>
              <div class="num-sub" id="sub-parent-sub"></div></div>
            <label class="toggle"><input type="checkbox" id="sub-show-parent"><span class="slider"></span></label>
          </div>
          <div class="num-row">
            <div class="num-label" id="sub-color-label">Badge color</div>
            <div class="swatches" id="sub-swatches"></div>
          </div>
        </div>
        <div class="num-help" id="sub-help"></div>
      </div>
      </div>
    </details>

    <details class="acc" data-key="export">
      <summary><span class="section-title" id="export-title">Export Data</span><span class="chev"></span></summary>
      <div class="acc-body">
      <div class="card">
        <div class="export-buttons">
          <button class="export-btn" id="export-csv">Download as CSV</button>
          <button class="export-btn" id="export-xlsx">Download as Excel</button>
        </div>
        <div class="export-status" id="export-status"></div>
      </div>
      </div>
    </details>

    <details class="acc" data-key="contact">
      <summary><span class="section-title" id="contact-title">Contact</span><span class="chev"></span></summary>
      <div class="acc-body">
      <div class="card">
        <a class="contact-btn" id="contact-btn" href="https://forms.gle/AWmvM5AsYsFhTwPz7" target="_blank" rel="noopener noreferrer">
          📩 <span id="contact-label">Bize Ulaşın</span>
        </a>
      </div>
      </div>
    </details>
  </div>
  <script src="/numbering.js"></script>
  <script src="/subtasks.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
