<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #172b4d;
      background: #f4f5f7;
      padding: 16px;
    }
    h2 { font-size: 14px; font-weight: 700; color: #172b4d; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #5e6c84; margin-bottom: 16px; line-height: 1.5; }
    .list-item {
      background: white;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .name-row {
      margin-bottom: 8px;
    }
    .list-name {
      font-size: 13px;
      font-weight: 600;
      color: #172b4d;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .threshold-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .done-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-label {
      font-size: 11px;
      color: #5e6c84;
      white-space: nowrap;
    }
    .threshold-input {
      width: 52px;
      padding: 4px 6px;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      color: #172b4d;
    }
    .threshold-input:focus {
      outline: none;
      border-color: #0052cc;
    }
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #dfe1e6; border-radius: 20px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #0052cc; }
    input:checked + .slider:before { transform: translateX(16px); }
    .save-btn {
      width: 100%; padding: 10px; background: #0052cc; color: white;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    .save-btn:hover { background: #0065ff; }
    .loading { text-align: center; color: #5e6c84; padding: 20px; }
  </style>
</head>
<body>
  <div id="root">
    <h2>List Settings</h2>
    <p class="subtitle">Set a threshold to flag slow cards in red. Mark lists as Done to freeze timers.</p>
    <div id="lists"><div class="loading">Loading lists...</div></div>
    <button class="save-btn" id="save" style="display:none">Save Settings</button>
  </div>
  <script src="/settings.js"></script>
</body>
</html>
