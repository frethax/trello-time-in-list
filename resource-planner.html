<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link rel="stylesheet" href="/resource-planning.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #f4f5f7; color: #172b4d; font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .intro { margin: 0 0 18px; color: #5e6c84; }
    .kb-plan-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .kb-plan-toolbar select { min-height: 30px; border: 1px solid #c1c7d0; border-radius: 5px; background: #fff; padding: 4px 8px; color: #172b4d; }
    .resource-filter-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 14px; padding: 12px 14px; background: #fff; border: 1px solid #dfe1e6; border-radius: 8px; }
    .resource-filter-copy { display: grid; gap: 3px; flex: 1; min-width: 180px; }
    .resource-filter-copy strong { font-size: 13px; }
    .resource-filter-copy span { color: #5e6c84; font-size: 12px; }
    .resource-filter { position: relative; }
    .resource-filter > summary { list-style: none; min-width: 185px; min-height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border: 1px solid #c1c7d0; border-radius: 5px; background: #fff; cursor: pointer; }
    .resource-filter > summary::-webkit-details-marker { display: none; }
    .resource-filter > summary::after { content: '▾'; margin-left: 12px; }
    .resource-filter > summary:focus-visible { outline: 2px solid #0052cc; outline-offset: 2px; }
    .resource-filter-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 8; width: min(300px, calc(100vw - 40px)); max-height: min(380px, 60vh); overflow: auto; padding: 12px; background: #fff; border: 1px solid #c1c7d0; border-radius: 6px; box-shadow: 0 6px 20px #091e4226; }
    .resource-filter-menu > label { display: block; margin-bottom: 5px; color: #5e6c84; font-size: 12px; }
    #resource-search { width: 100%; min-height: 32px; margin-bottom: 10px; padding: 5px 8px; border: 1px solid #c1c7d0; border-radius: 5px; color: #172b4d; }
    #resource-search:focus-visible { outline: 2px solid #0052cc; outline-offset: 1px; }
    .resource-filter-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .resource-filter-options { display: grid; gap: 2px; }
    .resource-filter-options label { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
    .resource-filter-options label:hover { background: #f4f5f7; }
    .resource-filter-options label[hidden] { display: none; }
    .resource-filter-options input { margin: 0; }
    #resource-no-results { margin: 8px 0 0; color: #5e6c84; }
    .kb-plan-toolbar button[aria-pressed="true"] { background: #e8f0ff; color: #0052cc; border-color: #0052cc; }
    #period-label { min-width: 160px; text-align: center; font-weight: 700; }
    .spacer { flex: 1; }
    #planner-status { min-height: 18px; margin-bottom: 8px; color: #5e6c84; }
    #planner-status.error { color: #bf2600; }
    .timeline-scroll { overflow: auto; max-height: calc(100vh - 170px); background: #fff; border: 1px solid #dfe1e6; border-radius: 8px; }
    .timeline-head, .timeline-row { display: flex; min-width: max-content; }
    .timeline-head { position: sticky; top: 0; z-index: 3; background: #f4f5f7; border-bottom: 1px solid #dfe1e6; }
    .member-head, .member-name { position: sticky; left: 0; z-index: 2; width: 165px; min-width: 165px; padding: 9px 10px; background: #fff; border-right: 1px solid #dfe1e6; font-weight: 600; }
    .member-head { background: #f4f5f7; z-index: 4; }
    .day-heads { display: grid; }
    .day-head { padding: 8px 0; border-right: 1px solid #dfe1e6; text-align: center; font-size: 11px; color: #5e6c84; }
    .day-head.weekend, .day-shade.weekend { background: #f4f5f7; }
    .timeline-row { border-bottom: 1px solid #dfe1e6; }
    .timeline-row:last-child { border-bottom: 0; }
    .member-name { display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; }
    .days-grid { display: grid; position: relative; min-height: 38px; padding: 3px 0; }
    .day-shade { border-right: 1px solid #ebecf0; grid-row: 1 / -1; z-index: 0; }
    .assignment { align-self: center; z-index: 1; display: block; margin: 2px 2px; padding: 5px 7px; border-radius: 4px; background: #e8f0ff; color: #0747a6; border: 1px solid #b3d4ff; font-size: 11px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .assignment:hover, .assignment:focus-visible { background: #deebff; outline: 2px solid #0052cc; outline-offset: -2px; }
    .assignment.conflict { background: #fff0ed; color: #bf2600; border-color: #ffbdad; }
    .legend { display: flex; gap: 14px; margin-top: 10px; color: #5e6c84; font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 12px; height: 12px; border: 1px solid #b3d4ff; background: #e8f0ff; border-radius: 2px; }
    .swatch.conflict { border-color: #ffbdad; background: #fff0ed; }
  </style>
</head>
<body>
  <h1>Resource Planner</h1>
  <p class="intro">Board assignments by member. Dates include full weekdays only; holidays are included.</p>
  <div class="resource-filter-bar" role="group" aria-label="Filter timeline by resources">
    <div class="resource-filter-copy"><strong>Filter resources</strong><span>Choose multiple members to show in the timeline.</span></div>
    <details class="resource-filter" id="resource-filter">
      <summary id="resource-filter-label">All resources</summary>
      <div class="resource-filter-menu">
        <label for="resource-search">Find a member</label>
        <input id="resource-search" type="search" autocomplete="off" placeholder="Search members">
        <div class="resource-filter-actions">
          <button id="resource-select-all" type="button">Select all</button>
          <button id="resource-select-none" type="button">Clear</button>
        </div>
        <div id="member-filter" class="resource-filter-options" role="group" aria-label="Visible resources"></div>
        <p id="resource-no-results" hidden>No matching members.</p>
      </div>
    </details>
  </div>
  <div class="kb-plan-toolbar">
    <button id="prev" type="button" aria-label="Previous period">‹</button>
    <span id="period-label"></span>
    <button id="next" type="button" aria-label="Next period">›</button>
    <button id="week" type="button">Week</button>
    <button id="month" type="button">Month</button>
    <span class="spacer"></span>
    <label><input id="show-archived" type="checkbox"> Show archived cards</label>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <div id="planner-status" role="status" aria-live="polite">Loading…</div>
  <div class="timeline-scroll"><div id="timeline"></div></div>
  <div class="legend"><span><i class="swatch"></i> Assignment</span><span><i class="swatch conflict"></i> Overlapping workdays</span></div>
  <script src="/resource-planning.js"></script>
  <script src="/resource-planning-ui.js"></script>
  <script src="/resource-planner.js"></script>
</body>
</html>
